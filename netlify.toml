[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://ajay-protfolio.netlify.app/*"
  to = "https://ajaykumarsaini.me/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/ask-ajay"
  to = "/.netlify/functions/ask-ajay"
  status = 200

[[redirects]]
  from = "/resume"
  to = "/resume.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

